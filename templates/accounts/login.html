{% extends "base.html" %}
{% block title %}Login — TastyHub{% endblock %}
{% block content %}
<section class="container">
    <div class="auth-card">
        <h3 class="brand-font text-center mb-4">Welcome Back</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-brand w-100">Login</button>
        </form>
        <p class="text-center mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
    </div>
</section>
{% endblock %}

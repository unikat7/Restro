{% extends "base.html" %}
{% block title %}Change Password — TastyHub{% endblock %}
{% block content %}
<section class="container">
    <div class="auth-card">
        <h3 class="brand-font text-center mb-4">Change Password</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-brand w-100">Update Password</button>
        </form>
    </div>
</section>
{% endblock %}
